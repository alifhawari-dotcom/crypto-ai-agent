# .github/workflows/oi.screener.yml
#
# PEMICU:
#  1. workflow_dispatch â€” WAJIB ADA. Ini pintu yang dipakai cron-job.org
#     (endpoint /actions/workflows/<file>/dispatches). Kalau dihapus,
#     cron-job.org langsung gagal 422. Juga dipakai untuk Run workflow manual.
#  2. schedule â€” cadangan longgar (tiap jam). Sengaja TIDAK 15 menit supaya
#     tidak tabrakan dengan cron-job.org yang sudah menangani frekuensi tinggi.
#     Fungsinya jaring pengaman kalau cron-job.org down / token kedaluwarsa.
#
# REGIME STATE:
#  oi_screener.py menulis regime_state.json tiap run (untuk deteksi reversal
#  di cycle berikutnya). Step "Commit regime state" di bawah men-commit file
#  itu balik ke repo. "[skip ci]" di commit message WAJIB ada, supaya commit
#  ini sendiri tidak memicu run workflow baru (infinite loop trigger).

name: OI/Funding/LS-Ratio Screener

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

concurrency:
  group: oi-screener-flow
  cancel-in-progress: true

permissions:
  contents: write   # wajib untuk step commit regime_state.json di bawah

jobs:
  oi_screener_job:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install aiohttp pandas numpy

      - name: Run OI/Funding/LS-Ratio Screener
        env:
          OI_TELEGRAM_TOKEN: ${{ secrets.OI_TELEGRAM_TOKEN }}
          OI_TELEGRAM_CHAT_ID: ${{ secrets.OI_TELEGRAM_CHAT_ID }}
          OI_DIAGNOSTIC: ${{ secrets.OI_DIAGNOSTIC }}
          OI_DETAIL: ${{ secrets.OI_DETAIL }}
        run: python oi_screener.py

      - name: Commit regime state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add regime_state.json
          git diff --staged --quiet || git commit -m "chore: update regime state [skip ci]"
          git push
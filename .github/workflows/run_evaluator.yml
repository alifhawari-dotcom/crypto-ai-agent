name: Audit Jurnal (Evaluator)

on:
  workflow_dispatch: # Hanya jalan jika kamu klik tombol manual

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install ccxt pandas numpy aiohttp
        
      - name: Run Evaluator
        run: python evaluator.py

      - name: Auto-Save Jurnal Audit
        run: |
          git config --global user.name "Bot-Auditor"
          git config --global user.email "[email protected]"
          git add trade_history.csv || echo "Tidak ada file"
          git commit -m "Audit hasil trade (Win/Loss) [skip ci]" || echo "Tidak ada perubahan status."
          git push

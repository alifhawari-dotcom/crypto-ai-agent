name: Crypto AI Agent 2026

on:
  # Berjalan otomatis setiap jam (agar irit kuota Gemini)
  schedule:
    - cron: '0 * * * *'
  # Memungkinkan pemicu manual dari tab Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install ccxt aiohttp pandas numpy
        
      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      # 🚀 BAGIAN KRUSIAL UNTUK MENYIMPAN JURNAL:
      - name: Auto-Save Logs
        run: |
          git config --global user.name "Bot-Logger"
          git config --global user.email "[email protected]"
          # Cek jika ada perubahan pada file csv, jika ada maka commit dan push
          git add trade_history.csv || echo "Belum ada file log."
          git commit -m "Update trade history [skip ci]" || echo "Tidak ada perubahan data."
          git push

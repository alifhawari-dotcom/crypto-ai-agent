name: Crypto AI Agent 2026

on:
  # Hanya menggunakan pemicu manual / API eksternal
  # Jadwal cron bawaan GitHub sudah dihapus agar tidak bentrok
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        # Pastikan pandas dan numpy tetap ada untuk God Mode Matrix
        run: pip install ccxt aiohttp pandas numpy
        
      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
